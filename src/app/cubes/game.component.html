<p class="tagline">
  Complete a plane through the cube center before your opponent.
</p>

<div class="game-controls">
  <a class="menu-link" routerLink="/">&larr; Menu</a>

  <span class="status">{{ statusText }}</span>

  @if (controller.canReset) {
    <button type="button" (click)="newGame()">
      New game
    </button>
  }
</div>

@if (inviteLink) {
  <p class="invite">
    Share this link with a friend to play:
    <br />
    <a [href]="inviteLink">{{ inviteLink }}</a>
  </p>
}

<svg
  class="game-component"
  viewBox="0 0 800 800"
  width="800"
  height="800"
  (pointerdown)="pointerPress($event)"
  (pointermove)="pointerMove($event)"
  (pointerup)="pointerRelease()"
  (pointercancel)="pointerRelease()"
>
  @for (c of cubeletsArray; track c.toString()) {
    <g
      visual-cube
      [mouseTracking]="mouseTracking"
      [size]="69"
      [xLocation]="400"
      [yLocation]="300"
      [centerX]="-100"
      [centerY]="0"
      [centerZ]="0"
      [offsetX]="getOffsetX(c)"
      [offsetY]="getOffsetY(c)"
      [offsetZ]="getOffsetZ(c)"
      [colour]="getCubeletColour(c)"
      [length]="cubeSize"
      [disabled]="!canSelect()"
      (selectionEvent)="select($event)"
    ></g>
  }
</svg>
